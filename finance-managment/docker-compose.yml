services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_portfolio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: finance_portfolio
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      # Match the Docker frontend port so CORS allows browser requests
      CORS_ORIGIN: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      # MCP servers must be accessible inside the backend container — the agent
      # engine spawns them as child processes via spawn('node', [mcpPath]).
      # Pre-build locally before starting: cd mcp-servers/smart-money-mcp-v2 && npm run build
      - ./mcp-servers:/app/mcp-servers
    command: npm run dev

  frontend:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_portfolio_test
    ports:
      - "5433:5432"
    profiles:
      - test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
