global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # NOTE: /api/v1/metrics returns JSON, not Prometheus text format.
  # To get real Prometheus metrics, add prom-client to the backend and expose
  # a dedicated /metrics endpoint using PrometheusModule from @willsoto/nestjs-prometheus.
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/api/v1/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
