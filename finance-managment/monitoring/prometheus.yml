global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/api/v1/metrics'

  - job_name: 'node'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/api/v1/health'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
